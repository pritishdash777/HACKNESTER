<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signing you in… — hacknester</title>
  <meta name="theme-color" content="#0b0c14">
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }
    .box { text-align: center; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Signing you in…</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      "https://yhipubroumcspclpybxz.supabase.co",
      "sb_publishable_OvHOiX9o3CPHIRqPEhvLow_JJJkCsPM"
    );

    (async () => {
      // Handle the redirect from GitHub or Magic Link
      const { data, error } = await supabase.auth.getSession();

      if (error || !data.session) {
        // Fallback: try to exchange the code if present
        const { data: sessionData, error: sessionError } = await supabase.auth.exchangeCodeForSession(window.location.href);
        if (sessionError || !sessionData.session) {
          window.location.href = "/login.html?error=auth_failed";
          return;
        }
      }

      // Success → go to home for now (later you can go to /dashboard or /onboarding)
      window.location.href = "/index.html";
    })();
  </script>
</body>
</html>
